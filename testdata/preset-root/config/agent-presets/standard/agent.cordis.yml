# 回归夹具（P42 / 踩坑 66）：--dsh-root 指向的 preset 树。
# readLimit 用一个不会与内置默认值（2000）撞车的数，用来证明 flag 真的被读到了；
# persona 也换成带标记的文案，便于人工排查。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a fixture persona for the --dsh-root regression. Working directory {{cwd}}.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 1777
