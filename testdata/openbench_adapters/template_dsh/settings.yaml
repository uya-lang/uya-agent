# dsh 隔离 home 的模板（评测用）。凭据不在这里 —— 由 runner 从
# ~/.dsh/.credentials.yaml 拷进来（见 ../README.md）。
#
# 两条硬约束（都是实测踩出来的，别删）：
#   1. **任何模型都不许带 `compat:`** —— 带 `compat.supportsReasoningEffort`
#      （true/false 都算）会让 dsh 整个 provider 注册失败：
#      NO_ADAPTER: no adapter registered for provider "aigw-local"。
#   2. `maxTokens` 必须与另一臂配对（本仓默认为 256000）。pi-ai 目录给这个
#      模型的默认是 32768，不配对会让 dsh 在 webcore 上撞顶、一个字节不落盘。
llm-pi-ai:
  providers:
    aigw-local:
      displayName: "aigw 本机（评测用隔离 home）"
      apiKeyEnv: AIGW_LOCAL_API_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:8088/v1
      models:
        - id: DeepSeek-V4.1-Flash
          contextWindow: 1000000
          maxTokens: 256000
          input: [ text, image ]
          reasoningEfforts:
            off: none
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
agent-default-model:
  provider: aigw-local
  model: DeepSeek-V4.1-Flash
  reasoningEffort: max
permission:
  defaultPreset: danger-full-access
