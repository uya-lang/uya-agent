# 覆盖层：把两臂都钉到 opencode.conf 那条真路线。
# 用 `dsh --patch <file>` 挂上去，优先级高于 $DSH_HOME/settings.yaml。
#
# 为什么必须覆盖 llm-deepseek：内置的 dsh-llm-deepseek 会先注册并抢走
# 默认路由（实测 request/header 里是 provider=deepseek-official /
# model=deepseek-flash，而不是这里配的 opencode 路线）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode:
        displayName: opencode zen
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1/
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 1000000
            maxTokens: 256000
            input: [ text, image ]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    baseURL: https://opencode.ai/zen/go/v1
    apiKeyEnv: OPENCODE_API_KEY
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        maxTokens: 256000
        inputModalities: [ text ]
