name: ci

# 三件事，按代价从低到高：
#   1. 静态审计（几秒）：文档覆盖、冲突标记、三条硬指标、界面接缝 —— 不编译。
#   2. 构建 + 快速自测：`make selftest-fast`（17 个域各跑一轮，测试时间约 10 s）。
#   3. 发布产物的形状：静态链接（无 PT_INTERP / 无 NEEDED）—— 这是本仓最核心的
#      「一个文件就是全部」那句断言的机器判据，放在 CI 里跑，别只写在 README 里。
#
# 为什么 1 与 2 分成两个 job：审计是纯文本检查（并行、秒级），自测要编译（42 s）。
# 合成一个 job 的话，改一个错别字也要等编译才能知道文档里有没有冲突标记。
#
# 已知的 CI 特有坑：宿主环境里的 `UYA_AGENT_*` 变量会被 `--print-config` 与 web
# 子进程继承那几条腿读到 —— 本机有这些变量时 `selftest[web-childcfg]` 会红
# （实测）。所以自测那一步显式清空它们。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文档覆盖 / 冲突标记 / 界面接缝
        run: make doc-cover doc-audit ui-audit
      - name: 三条硬指标（文件 ≤2000 行 / 函数 ≤100 行 / 行宽 ≤80 字符）
        run: make lint-size

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库自带 Uya 编译器（uya/bin/uya + uya/stdlib），**不需要装任何东西**。
      # 产物是静态链接，所以 runner 的 glibc 版本与本仓无关。
      - name: 构建
        run: make build

      - name: 真静态链接
        run: make link-audit

      - name: 快速自测（17 个域，测试时间约 10 s）
        env:
          UYA_AGENT_MODEL: ''
          UYA_AGENT_BASE_URL: ''
          UYA_AGENT_PROVIDER: ''
          UYA_AGENT_API: ''
          UYA_AGENT_API_KEY: ''
        run: make selftest-fast

      - name: 产物形状（给人看）
        run: |
          file build/uya-agent
          du -h build/uya-agent
          echo "PT_INTERP 条数: $(readelf -lW build/uya-agent | grep -c INTERP || true)"
          echo "NEEDED 条数:    $(readelf -dW build/uya-agent | grep -c NEEDED || true)"

  windows:
    runs-on: ubuntu-latest
    # 交叉编译依赖 zig（`make windows`）。这是**观察项**，先不让它挡合并 ——
    # 变绿一段时间之后再删 `continue-on-error`，否则第一天就会因为 zig 版本噪声
    # 把所有人的 PR 打红。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 装 zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: 交叉编译 Windows 产物
        run: make windows
      - name: 核对 PE32+
        run: make win-check
