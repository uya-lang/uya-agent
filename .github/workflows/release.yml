name: release

# 打一个 `v*` 标签就发版：构建 Linux 静态二进制 + Windows PE，附在同一份
# release 里。`install.sh` 就是按这个命名去下载的 —— 改这里的产物名时，
# **同时改 install.sh 里的 `uya-agent-${ARCH}`**，否则装的人会拿到 404。
#
# 产物命名：
#   uya-agent-linux-x86_64     ← install.sh 默认拿这个
#   uya-agent-windows-x86_64.exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发版的标签（例如 v0.1.1）'
        required: true

permissions:
  contents: write      # 上传 release 产物需要

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建（静态链接）
        run: make build STATIC=1

      - name: 核对真静态
        run: make link-audit

      - name: 离线快速自测（发出去的产物必须自己先跑绿）
        env:
          UYA_AGENT_MODEL: ''
          UYA_AGENT_BASE_URL: ''
          UYA_AGENT_PROVIDER: ''
          UYA_AGENT_API: ''
          UYA_AGENT_API_KEY: ''
        run: make selftest-fast

      - name: 改成 release 里的名字
        run: |
          cp build/uya-agent uya-agent-linux-x86_64
          chmod 755 uya-agent-linux-x86_64
          sha256sum uya-agent-linux-x86_64 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            uya-agent-linux-x86_64
            SHA256SUMS

  windows:
    runs-on: ubuntu-latest
    # Windows 产物是**可选项**：交叉编译依赖 zig，它红不该挡住 Linux 发版
    # （Linux 才是本仓的主线，也是 install.sh 唯一支持的平台）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: 交叉编译
        run: make windows
      - name: 核对 PE32+
        run: make win-check
      - name: 改成 release 里的名字
        run: |
          cp build/uya-agent.exe uya-agent-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: uya-agent-windows-x86_64.exe

  publish:
    needs: [linux, windows]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理产物（windows 那份可能没出来）
        run: |
          mkdir -p out
          cp dist/linux/uya-agent-linux-x86_64 out/
          cp dist/linux/SHA256SUMS out/ || true
          if [ -f dist/windows/uya-agent-windows-x86_64.exe ]; then
            cp dist/windows/uya-agent-windows-x86_64.exe out/
            (cd out && sha256sum uya-agent-windows-x86_64.exe >> SHA256SUMS)
          fi
          ls -l out/

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            ## 一个文件就是一个编程 agent

            ```bash
            curl -fsSL https://raw.githubusercontent.com/uya-lang/uya-agent/main/install.sh | sh
            ```

            或者手工：

            ```bash
            curl -LO https://github.com/uya-lang/uya-agent/releases/latest/download/uya-agent-linux-x86_64
            chmod +x uya-agent-linux-x86_64
            ./uya-agent-linux-x86_64 --tui-demo    # 先看一眼界面，不联网、不要 key
            ```

            * `uya-agent-linux-x86_64` —— 静态链接，无 `PT_INTERP` / 无 `NEEDED`
            * `uya-agent-windows-x86_64.exe` —— PE32+ 控制台程序（可选产物）
            * `SHA256SUMS` —— 校验和

            自测是**离线**的（内置 mock LLM），`--selftest` 要在仓库根跑；
            只想确认这个二进制在你机器上能跑，用 `--tui-demo`。
