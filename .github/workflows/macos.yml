name: macos

# macOS 两档 arch（x86_64 / arm64）的真机自测。与 ci.yml 分开的理由：
#   ① 代价差一个数量级：ci.yml 全是 ubuntu（分钟数 ×1），macOS runner 是 ×10；
#      合在一起会让「改个错别字」也排进 macOS 队列（macOS runner 起得也慢）。
#   ② 结构跟 ci.yml 的 windows job 同形：**ubuntu 上交叉编译 → 目标机只负责跑**。
#
# 为什么不在 macOS runner 上编译：本仓自带的编译器 `uya/bin/uya` 是 **Linux ELF**
# （v0.10.4），macOS 上跑不了。要原生编译，得先有一份 macOS 版 uya 编译器；在那之前
# 编译这一跳只能留在 ubuntu（zig cc 交叉编译，见 testdata/macos/README.md §1）。
#
# 这两台 runner 补的是同一条空白：dockur/macos 那台客户机是 **x86_64**（README
# §3/§4），Apple Silicon 上跑不了；而 macOS **arm64** 客户机要 Apple Silicon 的
# Virtualization.framework，x86_64 Linux 宿主起不来。GitHub 的 `macos-14` /
# `macos-15` 就是 Apple Silicon 真机，于是 arm64 那档的 `--selftest` 第一次有地方跑。
#
# 判据与本地一致（README §2）：**看退出码**，不要 grep `SELFTEST ... PASS`
# —— 那句走显示用 stderr，重定向时不进文件。
#
# **日志怎么读**（这条是硬需求，不是洁癖）：GitHub 的 job 日志要认证才能下载
# （未认证 `GET /actions/jobs/<id>/logs` 是 403），而 runner 上的失败恰恰是最需要
# 看清的东西。所以失败时 workflow 自己把日志顶出去，走两条**公开可读**的路：
#   - check-run 的 annotations（`::error ::` 行，几十行够定位到文件行号）；
#   - commit comment（整段日志尾部几十 KB，用 `${{ github.token }}` 发）。
# 有了这两条，没装 gh、没登录也能把一个红 run 查到底。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'uya/**'
      - 'Makefile'
      - 'scripts/**'
      - 'testdata/macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'uya/**'
      - 'Makefile'
      - 'scripts/**'
      - 'testdata/macos/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

# 失败时发 commit comment 需要写权限；其余只用只读。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 显式给 ZIG：Makefile 的默认值是 `command -v zig`，找不到会退回一个本机绝对
    # 路径（开发机上的 `/home/winger/...`）。runner 上那个路径不存在，出错时只会
    # 得到一句「No such file or directory」，看不出是 zig 没装上。
    env:
      ZIG: zig
    steps:
      - uses: actions/checkout@v4

      # 版本钉死：本仓的 Darwin 路径是拿 0.16.0 验的（`aarch64-macos` 目标、
      # `-fno-sanitize=undefined`、`-Wl,-stack_size` 都在这一版上过）。换版本先看
      # zig 的 target query 是否还认 `*-macos`（0.13 那版不认，见 Makefile 注释 ④）。
      # 本机 PATH 上的 0.17.0-dev 实测**直接构建失败**，所以这个版本号不能松。
      #
      # 为什么不用 `mlugg/setup-zig@v1`：run #1 就红在那一跳，而当时还没有日志通道。
      # 换成自己 curl 之后，失败点写在 URL 与 `ls -l` 上，谁都能本地重跑同一条命令。
      - name: 装 zig 0.16.0（直接下 ziglang.org 的 tarball）
        env:
          ZIG_VER: 0.16.0
        run: |
          url="https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          echo "GET $url"
          curl -fsSL --retry 3 --retry-delay 2 -o zig.tar.xz "$url"
          ls -l zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      # 先确认仓库自带的编译器在这个 runner 上真能跑 —— 它跟后面的交叉编译失败
      # 是两件事，混在一起会白查很久。
      - name: 编译器自检（uya/bin/uya 能不能在这个 runner 上跑）
        run: |
          set +e
          ./uya/bin/uya --version > /tmp/uya-ver.txt 2>&1
          rc=$?
          cat /tmp/uya-ver.txt
          echo "uya --version exit=$rc"
          if [ "$rc" != "0" ]; then
            echo "::error title=uya 编译器跑不起来::rc=$rc $(head -c 200 /tmp/uya-ver.txt)"
            exit $rc
          fi

      # 交叉编译。失败时顺手把日志里的错误行顶成注解 —— 注解是公开的，job 日志不是。
      # （`make macos` 自己带重试：撞上「生成的 .c 被写坏」会清缓存重来，见
      #   scripts/uya_build_retry.sh；这里拿到的是最后一次尝试的日志。）
      - name: 交叉编译 x86_64
        run: |
          set +e
          log=build/macos/build-x86_64.log
          make macos > /tmp/make.log 2>&1
          rc=$?
          cat /tmp/make.log
          [ "$rc" = "0" ] && exit 0
          [ -f "$log" ] || log=/tmp/make.log
          echo "::error title=make macos 失败::rc=$rc，log=$log"
          grep -iE 'error:|error |错误|No such file|cannot|not found|undefined reference|FAILED|uya_build_retry' "$log" \
            | head -12 > /tmp/errs.txt
          [ -s /tmp/errs.txt ] || tail -12 "$log" > /tmp/errs.txt
          while IFS= read -r line; do echo "::error ::$line"; done < /tmp/errs.txt
          exit $rc

      - name: 交叉编译 arm64
        run: |
          set +e
          log=build/macos/build-arm64.log
          make macos MACOS_ARCH=arm64 > /tmp/make-arm64.log 2>&1
          rc=$?
          cat /tmp/make-arm64.log
          [ "$rc" = "0" ] && exit 0
          [ -f "$log" ] || log=/tmp/make-arm64.log
          echo "::error title=make macos MACOS_ARCH=arm64 失败::rc=$rc，log=$log"
          grep -iE 'error:|error |错误|No such file|cannot|not found|undefined reference|FAILED|uya_build_retry' "$log" \
            | head -12 > /tmp/errs64.txt
          [ -s /tmp/errs64.txt ] || tail -12 "$log" > /tmp/errs64.txt
          while IFS= read -r line; do echo "::error ::$line"; done < /tmp/errs64.txt
          exit $rc

      # 形状判据：Mach-O 位数/arch、链接 libSystem、LC_MAIN.stacksize ≥ 64 MB。
      # 栈这条最容易悄悄丢 —— 少了它产物照样能起，只是跑到 web/tui 组才 SIGSEGV，
      # 而 macOS 上不留 crash report。
      - name: 形状判据（两档）
        run: |
          make macos-check
          make macos-check MACOS_ARCH=arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macho
          if-no-files-found: error
          path: build/macos/uya-agent*

      # 整段日志贴到 commit comment：注解只有十几行，碰上「重试了几次」「链接失败」
      # 这类问题不够用。公开仓的 commit comment 谁都能读，未认证 GET 也行。
      - name: 失败时把构建日志贴成 commit comment（公开可读）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          python3 - \
            build/macos/build-x86_64.log build/macos/build-arm64.log \
            build/macos/build-x86_64.log.first build/macos/build-arm64.log.first \
            /tmp/make.log /tmp/make-arm64.log <<'PY' > /tmp/body.json
          import json, os, re, sys
          # 日志里大半是「每条 zig cc 一大行」的编译命令，整段贴没用；先挑错误行与
          # 重试器的话，再附日志尾部，够判断「第几次尝试、坏在哪、有没有重试」。
          pat = re.compile(
              r'error:|错误|No such|cannot|not found|undefined reference'
              r'|uya_build_retry|构建失败', re.I)
          out = []
          for p in sys.argv[1:]:
              if not os.path.exists(p):
                  continue
              lines = open(p, encoding='utf-8', errors='replace').read().splitlines()
              sec = ['== %s（%d 行）==' % (p, len(lines))]
              errs = [l for l in lines if pat.search(l)]
              if errs:
                  sec.append('错误行（尾 40）：\n```\n%s\n```' % '\n'.join(errs[-40:]))
              sec.append('日志尾 40 行：\n```\n%s\n```' % '\n'.join(lines[-40:]))
              out.append('\n\n'.join(sec))
          print(json.dumps({'body': ('\n\n'.join(out)[:60000]
                                    or '(没有找到日志文件)')}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            > /tmp/comment.json
          python3 -c "import json;d=json.load(open('/tmp/comment.json'));print('comment:', d.get('html_url') or d)"

  test:
    needs: build
    # pty 类回合在 macOS 上曾经**永久阻塞**（写 master 等从设备，见 README §4.2）。
    # 有超时兜底，最坏情况 30 min 收场，而不是把 runner 的 6 h 全吃掉。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel：macOS 13。这台是**复现**用 —— x86_64 的真机证据已经有一份
          # （dockur/macos 客户机，README §4），这里只是让别人也能一键重跑。
          # 镜像哪天退役就直接删这一行，别为它改判据。
          - runner: macos-13
            bin: uya-agent
            observe: true
          # Apple Silicon（M1）：arm64 的唯一真机证据来源，在此之前一条自测都没跑过。
          # 先当观察项（`observe: true`）：README §6.5 列了 5 个「最可能先炸」的地方
          # （信号布局排第一），第一次跑大概率有红。红过几轮、把数字记进 README §6
          # 之后，再把 `observe` 改成 false 让它挡合并。
          - runner: macos-14
            bin: uya-agent-arm64
            observe: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.observe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macho

      # 夹具是硬依赖：全量里有几轮往 `testdata/` 下写假 runner / 假 Xauthority
      # （README §4.3 最后一条），缺了它们那几轮必红，且红得跟 macOS 无关。
      # artifact 落盘时的相对路径不保证（v4 按「共同前缀」裁），所以用 find 找；
      # **找到的就在当前目录时不能 cp**（run #5 就栽在 `cp: 'x' and './x' are the
      # same file` 上 —— 步骤直接失败，后面的自测一步没跑）。
      # 整个步骤的输出落 setup.log，失败时要贴进 commit comment。
      - name: 取产物
        run: |
          set +e
          {
            ls -la | head -20
            src=$(find . -name "${{ matrix.bin }}" -type f -not -path './.git/*' | head -1)
            echo "src=$src"
            if [ -z "$src" ]; then
              echo "没找到 ${{ matrix.bin }}，看看有什么："
              find . -maxdepth 3 -type f -name 'uya-agent*' | head -10
              exit 1
            fi
            if [ "$src" != "./${{ matrix.bin }}" ]; then
              cp "$src" "./${{ matrix.bin }}" || exit 1
            fi
            chmod +x "./${{ matrix.bin }}" || exit 1
            file "./${{ matrix.bin }}"
            ls -l "./${{ matrix.bin }}"
          } > setup.log 2>&1
          rc=$?
          cat setup.log
          exit $rc

      - name: 自报环境（证明这是哪台机器、哪个 arch）
        run: |
          uname -a
          sw_vers
          echo "arch=$(uname -m)  rosetta=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"
          codesign -dv --verbose=2 "./${{ matrix.bin }}" 2>&1 | head -8 || true

      - name: 帮助文本（中文 + 退出码 0）
        run: |
          set +e
          "./${{ matrix.bin }}" --help > help.txt 2>&1
          rc=$?
          head -3 help.txt
          echo "help exit=$rc"
          exit $rc

      # 这两组是 README §4.3 里在 x86_64 上**全绿**的组，判据就是它们自己：
      # 绿了才谈得上「这个 arch 能跑」。日志落盘（goal.log / tui.log）——
      # 失败时要贴进 commit comment。
      - name: GOAL 组（4 轮）
        env:
          UYA_SELFTEST_GOAL_ONLY: '1'
          UYA_AGENT_MODEL: ''
          UYA_AGENT_BASE_URL: ''
          UYA_AGENT_PROVIDER: ''
          UYA_AGENT_API: ''
          UYA_AGENT_API_KEY: ''
        run: |
          set +e
          "./${{ matrix.bin }}" --selftest > goal.log 2>&1
          rc=$?
          tail -40 goal.log
          echo "GOAL exit=$rc"
          exit $rc

      - name: TUI 组（41 轮，其中 13 轮带真 PTY 腿）
        env:
          UYA_SELFTEST_TUI_ONLY: '1'
          UYA_AGENT_MODEL: ''
          UYA_AGENT_BASE_URL: ''
          UYA_AGENT_PROVIDER: ''
          UYA_AGENT_API: ''
          UYA_AGENT_API_KEY: ''
        run: |
          set +e
          "./${{ matrix.bin }}" --selftest > tui.log 2>&1
          rc=$?
          tail -40 tui.log
          echo "TUI exit=$rc"
          exit $rc

      # 全量：x86_64 上是「137 绿 / 12 红」（README §4.3，其中 `resp-build` 在 Linux
      # 上也红）。arm64 上还没有数字。这一档先只收集、不判红 —— 日志留全，下一步
      # 就是照它把 12 条红的 arch 相关性一条条分出来。
      - name: 全量（只收集，不判红）
        env:
          UYA_AGENT_MODEL: ''
          UYA_AGENT_BASE_URL: ''
          UYA_AGENT_PROVIDER: ''
          UYA_AGENT_API: ''
          UYA_AGENT_API_KEY: ''
        run: |
          set +e
          log="full-${{ matrix.bin }}.log"
          "./${{ matrix.bin }}" --selftest > "$log" 2>&1
          rc=$?
          echo "full exit=$rc"
          echo "FAIL 行数：$(grep -c ' FAIL' "$log" || true)"
          echo "--- 红项："
          grep ' FAIL' "$log" | head -20 || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log-${{ matrix.bin }}
          if-no-files-found: warn
          path: |
            setup.log
            help.txt
            goal.log
            tui.log
            full-${{ matrix.bin }}.log

      - name: 失败时把自测日志贴成 commit comment（公开可读）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUNNER: ${{ matrix.runner }}
          BIN: ${{ matrix.bin }}
        run: |
          set +e
          python3 - setup.log goal.log tui.log "full-$BIN.log" help.txt <<'PY' > /tmp/body.json
          import json, os, sys
          # 自测日志是「几十条 ok + 一条 FAIL」，只贴尾巴会把 FAIL 那句连同它的
          # 诊断行一起截掉（run #7 就是这样）。所以：先给 FAIL 前后 8 行的上下文
          # 与 paste 诊断行，再附头 20 / 尾 40 行。
          out = ['runner=%s  bin=%s' % (os.environ.get('RUNNER'), os.environ.get('BIN'))]
          for p in sys.argv[1:]:
              if not os.path.exists(p):
                  continue
              lines = open(p, encoding='utf-8', errors='replace').read().splitlines()
              out.append('== %s（%d 行）==' % (p, len(lines)))
              keep = set()
              for i, l in enumerate(lines):
                  if ' FAIL' in l or 'paste-log' in l or l.startswith('rc='):
                      keep.update(range(max(0, i - 8), min(len(lines), i + 9)))
              if keep:
                  ctx = '\n'.join(lines[i] for i in sorted(keep))
                  out.append('失败附近（含前后 8 行）：\n```\n%s\n```' % ctx)
              head = '\n'.join(lines[:20])
              tail = '\n'.join(lines[-40:])
              out.append('头 20 行：\n```\n%s\n```' % head)
              out.append('尾 40 行：\n```\n%s\n```' % tail)
          print(json.dumps({'body': '\n\n'.join(out)[:60000]}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            > /tmp/comment.json
          python3 -c "import json;d=json.load(open('/tmp/comment.json'));print('comment:', d.get('html_url') or d)"
